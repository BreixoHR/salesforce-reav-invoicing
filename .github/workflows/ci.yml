name: ci

on:
  push:
  pull_request:

jobs:
  apex-lint:
    # Comprueba que todo el Apex parsea y respeta el formato
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
